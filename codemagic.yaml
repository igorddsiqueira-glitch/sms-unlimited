workflows:
  android-debug:
    name: SMS Fácil Android APK
    max_build_duration: 60
    # mac_mini_m2 is available on Codemagic's individual free plan.
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          gradle --version
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
