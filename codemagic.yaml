workflows:
  android-debug:
    name: SMS Fácil Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          gradle --version
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
